name: rtm_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cuda-version=12.*
  - pytorch=*=*cuda*
  - torchvision
  - pytorch-lightning
  - libblas=*=*openblas
  - wandb>=0.19
  - hydra-core
  - gpustat
  - ipython
  - ipykernel
  - pytest
  - numpy
  - matplotlib
  - scipy
  - netcdf4
  - pyhdf
  - pandas
  - scikit-learn
  - seaborn
  - xarray
  - pip
  - pip:
    - torch-pca