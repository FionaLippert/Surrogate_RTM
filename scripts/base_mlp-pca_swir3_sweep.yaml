program: train_eval.py
name: base_mlp-pca_swir3_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_swir3_spectrometer_only_LHS_matched_retrieval_era5_paper
  - model=MLP_PCA_tempPCA_constant_latent_dim
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - model.forward_model.decoder.fixed_components=true
  - transforms=log_targets_log_proxy_log_albedo_log_reff_era5 # or no log_reff?
  - task.train_frac=1.0
  - trainer.max_epochs=75
  - model.lr=1e-3
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=false
  - task.save_predictions=false
  - task.load_best_model=false # use latest
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_swir3_era5_sweep_final
  - logger.group=default
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [1]
    # values: [0, 1, 2]
  # hidden (and PCA) dimension
  model.hidden_dim:
    # values: [80, 110, 140, 170, 200, 230, 260, 801]
    # values: [8, 40, 80, 160, 240, 320, 400, 481, 561, 641, 721, 801]
    # values: [32, 64, 128, 256]
    values: [16, 32, 64, 128, 256]
  model.output_latent_dim:
    # 70 (RMSE < 1e-3) to 450 (RMSE < 1e-5)
    # values: [70, 100, 150, 200, 250, 300, 350, 400, 450]
    # values: [350, 400, 450]
    values: [140]
  model.forward_model.core_nn.n_fc_layers:
    values: [1, 2, 3, 4, 5]
    # values: [3]