program: train_eval.py
name: test
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - dataset=synthetic_remotap
  - model=LatentNNSurrogateRTM
  - model.output_latent_dim=26
  - model.l2_reg=4e-5
  - model.dropout_p=0.0
  - model.forward_model.n_hidden=128
  - dataloader.batch_size=256
  - trainer.max_epochs=15
  - task=train+eval
  - task.save_predictions=true
  - task.load_best_model=true
  - task.final_eval=true
  - logger.project=testing
  - logger.group=default
method: grid
metric:
  name: test/MAPE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
  # learning rate
  model.lr:
    values: [1e-4]
  # input latent dimension
  model.input_latent_dim:
    values: [160]
  # number of layers
  model.forward_model.n_fc_layers:
    values: [2]