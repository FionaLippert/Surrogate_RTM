program: train_eval.py
name: vary_pc_dim
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_diff
  - model=LatentNNSurrogateRTMDiff
  - model.output_latent_dim=26
  - model.l2_reg=4e-5
  - model.dropout_p=0.0
  - model.forward_model.n_hidden=128
  - dataloader.batch_size=256
  - trainer.max_epochs=250
  - task=train+eval
  - task.save_predictions=true
  - task.load_best_model=true
  - logger.project=RTM_vary_input_pca_dim
  - logger.group=predict_diff #no_proxy
method: grid
metric:
  name: test/MAPE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0] #[0, 1, 2] # [0, 1, 2]
  # learning rate
  model.lr:
    values: [1e-4] #[3e-4]
  # input latent dimension
  model.input_latent_dim:
    values: [10] #[10, 20, 40, 80, 160, 303] #[20, 80, 320]
  # number of layers
  model.forward_model.n_fc_layers:
    values: [1] #[1, 2, 3, 4, 5, 6]