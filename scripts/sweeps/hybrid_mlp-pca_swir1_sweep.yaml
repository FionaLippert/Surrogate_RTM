program: train_eval.py
name: hybrid_mlp-pca_swir1_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_swir1_ratio_spectrometer_only_LHS_matched_retrieval_era5_paper
  - model=MLP_PCA_Ratio_tempPCA_constant_latent_dim
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - model.forward_model.decoder.fixed_components=true
  - transforms=log_targets_log_proxy_log_albedo_era5
  - task.train_frac=1.0
  - trainer.max_epochs=75
  - model.lr=1e-3
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=false
  - task.save_predictions=false
  - task.load_best_model=false # use latest
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_swir1_era5_sweep_hp_search
  - logger.group=default
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
    # values: [0, 1, 2]
  # hidden (and PCA) dimension
  model.hidden_dim:
    # values: [30, 60, 90, 120, 150, 180, 210, 851]
    # values: [9, 43, 85, 170, 255, 340, 426, 511, 596, 681, 766, 851]
    values: [16, 32, 64, 128, 256]
  model.forward_model.core_nn.n_fc_layers:
    values: [1, 2, 3, 4, 5]