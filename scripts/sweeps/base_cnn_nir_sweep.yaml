program: train_eval.py
name: base_cnn_nir_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_nir_spectrometer_only_LHS_matched_retrieval_era5_paper
  - dataset.normalization.per_wavelength=false
  - model=SequenceNNSurrogateRTM_tempPCA_input_processing
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - transforms=log_targets_log_proxy_log_albedo_era5
  - task.data_frac=1.0
  - trainer.max_epochs=75
  - model.lr=1e-3
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=false
  - task.save_predictions=false
  - task.load_best_model=false # use latest
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_nir_era5_sweep_hp_search
  - logger.group=default
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
  model.hidden_dim:
    values: [16, 32, 64, 128, 256]
  model.n_layers:
    values: [2, 3, 4, 5, 6]
  model.decrease_channels:
    values: [1, 2]