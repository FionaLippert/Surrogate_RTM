program: train_eval.py
name: cnn_swir3_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_swir3_spectrometer_only_LHS_matched_retrieval_era5_paper
  - model=SequenceNNSurrogateRTM_proxy_input_tempPCA_input_processing
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - transforms=log_targets_log_proxy_log_albedo_era5
  - task.train_frac=1.0
  - trainer.max_epochs=75
  - model.lr=1e-3
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=false
  - task.save_predictions=false
  - task.load_best_model=false # use latest
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_swir3_era5_sweep
  - logger.group=default
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
    # values: [0, 1, 2]
  # hidden (and PCA) dimension
  model.hidden_dim:
    # values: [20, 40, 60, 80, 100, 211]
    values: [16, 32, 64, 128]
  model.forward_model.sequence_module.n_layers:
    # values: [2, 3, 4, 5, 6]
    values: [2, 4, 6, 8]