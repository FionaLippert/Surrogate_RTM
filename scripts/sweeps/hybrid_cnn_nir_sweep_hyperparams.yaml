program: train_eval.py
name: hybrid_cnn_nir_sweep_hyperparams
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_nir_ratio_spectrometer_only_LHS_matched_retrieval_era5_paper
  - dataset.normalization.per_wavelength=false
  - model=SequenceNNSurrogateRTMRatio_proxy_input_tempPCA_input_processing
  - model.decrease_channels=last_layer
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - transforms=log_targets_log_proxy_log_albedo_era5
  - task.data_frac=1.0
  - trainer.max_epochs=75
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=true
  - task.save_predictions=false
  - task.load_best_model=true
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_nir_era5_sweep_hyperparams
  - logger.group=hyperparams
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
  model.hidden_dim:
    values: [16, 32, 64, 128, 256]
    # values: [128]
  model.n_layers:
    values: [1, 2, 3]
    # values: [2]
  model.forward_model.sequence_module.n_output_layers:
    values: [1, 2]
    # values: [1]
  model.forward_model.sequence_module.kernel_size:
    values: [3, 5, 7]
    # values: [5]
  model.lr:
    values: [5e-4, 1e-3, 2e-3]
    # values: [1e-3]