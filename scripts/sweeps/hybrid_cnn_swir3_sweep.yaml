program: train_eval.py
name: hybrid_cnn_swir3_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - device=snellius
  - dataset=synthetic_remotap_swir3_ratio_spectrometer_only_LHS_matched_retrieval_era5_paper
  - dataset.normalization.per_wavelength=false
  - model=SequenceNNSurrogateRTMRatio_proxy_input_tempPCA_input_processing
  - model.nonlinearity=silu
  - model.dropout_p=0.001
  - transforms=log_targets_log_proxy_log_albedo_era5
  - task.data_frac=1.0
  - trainer.max_epochs=75
  - model.lr=1e-3
  - dataloader.batch_size=256
  - task=train+eval
  - task.final_eval=false
  - task.save_predictions=false
  - task.load_best_model=false # use latest
  - task.measure_cpu_time=false
  - logger.project=spectrometer_only_swir3_era5_sweep_hp_search
  - logger.group=3_layer_input_processing
method: grid
metric:
  name: test/RMSE_continuum
  goal: minimize
parameters:
  # random seed
  seed:
    values: [0]
  model.hidden_dim:
    values: [16, 32, 64, 128, 256]
  model.n_layers:
    values: [1, 2, 3, 4, 5]
  model.decrease_channels:
    values: [1, "last_layer"]
  model.forward_model.sequence_module.kernel_size:
    values: [3, 5]