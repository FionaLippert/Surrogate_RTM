# @package model
name: LatentNNSurrogateRTM
_target_: rtm.models.LatentNNSurrogateRTM


input_dim: ${dataset.input_dim} # all features
output_dim: ${dataset.output_dim} # all wavelengths

input_latent_dim: ${dataset.input_dim} # all features
output_latent_dim: 26 # 99.9999% explained variance

# nonlinearity used after the encoder and before the decoder
nonlinearity: null


lr: 1e-4
l2_reg: 4e-5
dropout_p: 0.0

loss_terms:
  - _target_: rtm.loss.WeightedMSE
    weight: 1.0
    # log_transformed: false

input_dim_reduction:
  _target_: rtm.dimensionality_reduction.PCA
  n_components: ${model.input_latent_dim}

output_dim_reduction:
  _target_: rtm.dimensionality_reduction.PCA
  n_components: ${model.output_latent_dim}

forward_model:
  _target_: rtm.models.MLP_v2
  n_in: ${model.input_latent_dim}
  n_out: ${model.output_latent_dim}
  n_hidden: 128
  n_fc_layers: 5
  dropout_p: ${model.dropout_p}
  nonlinearity: relu