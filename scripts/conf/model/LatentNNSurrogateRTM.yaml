# @package model
name: LatentNNSurrogateRTM
_target_: rtm.models.LatentNNSurrogateRTM


input_dim: ${dataset.input_dim} # all features
output_dim: ${dataset.output_dim} # all wavelengths

input_latent_dim: ${dataset.input_dim} # all features
output_latent_dim: 26 # 99.9999% explained variance

# nonlinearity used after the encoder and before the decoder
nonlinearity: null

dropout_p: 0.0

loss_terms:
  - _target_: rtm.loss.WeightedMAE
    weight: 1.0
    # log_transformed: false

input_dim_reduction:
  _target_: rtm.dimensionality_reduction.PCA
  # _target_: rtm.layers.PCAEncoder
  n_components: ${model.input_latent_dim}

output_dim_reduction:
  _target_: rtm.dimensionality_reduction.PCA
  # _target_: rtm.laeers.PCADecoder
  n_components: ${model.output_latent_dim}

forward_model:
  _target_: rtm.models.MLP_v2
  n_in: ${model.input_latent_dim}
  n_out: ${model.output_latent_dim}
  n_hidden: 128
  n_fc_layers: 5
  dropout_p: ${model.dropout_p}
  nonlinearity: relu

lr: 1e-3
l2_reg: 0.0 # 4e-5
lr_decay: 0.001
lr_scheduler_interval: step
lr_schedulers:
        - _target_: torch.optim.lr_scheduler.LinearLR
          _partial_: true
          start_factor: 1e-5
          end_factor: 1.0
          total_iters: 5000  # 10 # number of intervals (steps or epochs)
        # - _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        #   _partial_: true
        #   T_max: 1e5 #${trainer.max_epochs}
        #   eta_min: ${eval:'${model.lr} * ${model.lr_decay}'}
        - _target_: torch.optim.lr_scheduler.LambdaLR
          _partial_: true
          lr_lambda: 
            _target_: rtm.utils.LRDampenedCosine
            lr_min: ${model.lr_decay}
            lr_max: 1.0
            T_max: 50000
            gamma: 0.95
            gamma_interval: 1000
lr_milestones:
       - 5000 # 10