# @package model
name: Autoencoder
_target_: rtm.dimensionality_reduction.AE

target_quantity: targets

output_dim: ${dataset.output_dim} # all wavelengths
latent_dim: 26

lr: 1e-3
l2_reg: 4e-5
dropout_p: 0.0

# loss_terms:
#   - _target_: rtm.loss.WeightedMSE
#     weight: 1.0
#     # log_transformed: false


############## define model components ################

encoder:
  _target_: rtm.dimensionality_reduction.RTCNNEncoder
  latent_dim: ${model.latent_dim}
  num_wavelengths: ${model.output_dim}
  kernel_size: 3
  num_layers: 3
  dropout: ${model.dropout_p}

decoder:
  _target_: rtm.dimensionality_reduction.RTCNNDecoder
  latent_dim: ${model.latent_dim}
  num_wavelengths: ${model.output_dim}
  kernel_size: 3
  num_layers: 3
  dropout: ${model.dropout_p}