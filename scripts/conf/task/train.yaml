# @package task
name: train

# fraction of the dataset to be used for training/validation/testing
data_frac: 1.0

# save predictions?
save_predictions: false

# final evaluation on test set?
final_eval: false

# use best instead of last model for evaluation and prediction?
load_best_model: false

# measure model runtime on CPU?
measure_cpu_time: false

# for debugging: detect numerical anomalies during training
detect_anomalies: false

# TorchScript settings for tracing NN forward model
trace_model: true
trace_with_gpu: false # if true, trace model on GPU (if available) instead of CPU
trace_with_proxy_input: true # if true, traced model requires non-scattering proxy as input (even if not used)
trace_with_profile_input: true # if true, traced model requires profile input (even if not used) 