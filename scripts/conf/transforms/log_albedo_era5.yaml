# @package transforms
name: log_albedo_era5_transform
_target_: rtm.rtm_transforms.RTMTransformCollection

transforms:
  pixel_transform:
    _target_: rtm.rtm_transforms.LogTransformSelectedFeatures
    feature_indices: [5] # albedo
    n_features: ${len:${dataset.pixel_features}} # number of pixel features
    feature_dim: 1 # pixel features have shape (batch_size, n_features)
  profile_transform: 
    _target_: rtm.rtm_transforms.NullTransform
  target_transform:
    _target_: rtm.rtm_transforms.NullTransform
  proxy_transform:
    _target_: rtm.rtm_transforms.NullTransform
  jacobian_transform: rtm.rtm_transforms.NullTransform