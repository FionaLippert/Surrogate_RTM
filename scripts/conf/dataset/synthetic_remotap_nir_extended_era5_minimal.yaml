# @package dataset
name: synthetic_remotap_nir_extended_era5_minimal
_target_: rtm.datasets.uvns_datasets.FlatRTDataset

# don't touch to ensure the same data split is used for all experiments
seed: 0 # random seed used to define data split
test_size: 0.1 # fraction of the dataset to be used for testing
val_size: 0.05 # fraction of the training dataset to be used for validation

# point to data files
data_dir: ${device.data_root}/random_ensemble_1e6_new/NIR_preprocessed/combined_nchunks=16
prefix: syn_meas_s5_random_ensemble_1e6_combined
# data_dir: ${device.data_root}/random_ensemble_1e6/SWIR1_preprocessed
# prefix: syn_meas_s5_random_ensemble_1e6_01

# define output quantity
target_quantity: radiance
predict_difference: false

# should be adjusted to the actual number of features and wavelengths in 
# the dataset (is used to define the model input/output dimensions)
input_dim: 25 # all features
output_dim: 211 # all wavelengths

# define input features
pixel_features:
  - cos_SolarZenithAngle
  - cos_ViewingZenithAngle
  - RelativeAzimuthAngle # note that Lintran uses this in radians as defined by De Haan et al. (1987)
  - ScatteringAngle
  - surface_pressure_meteo
  - tropopause_height
  - surface_elevation_meteo
  - B_pol # XBPDF scale / Maignan M
  - k_geo
  - k_vol
  - albedo
  - reff_mode1
  - veff_mode1
  - RRI_mode1
  - IRI_mode1
  - log_N_mode1
  - f_sphere_mode1
  - z_aer_mode1
  - reff_mode2
  - veff_mode2
  - RRI_mode2
  - IRI_mode2
  - log_N_mode2
  - f_sphere_mode2
  - z_aer_mode2
profile_features: []
  # - MMR_h2o
  # - MMR_co2
  # - MMR_ch4
  # - pressure
  # - temperature


# # transforms for input features
# transform: null

# # transforms for output spectra
# target_transform:
#   _target_: rtm.transforms.LogTransform

# # transforms for proxy input spectra
# proxy_transform: null


# normalization settings
normalization:
  per_wavelength: true # normalize spectral channels separately
  per_layer: true # normalize vertical layers separately
  coupled_proxy: false # separate proxy and target normalization