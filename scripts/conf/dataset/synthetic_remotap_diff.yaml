# @package dataset
name: synthetic_remotap
_target_: rtm.datasets.uvns_datasets.FlatRTDataset

# don't touch to ensure the same data split is used for all experiments
seed: 0 # random seed used to define data split
test_size: 0.2 # fraction of the dataset to be used for testing
val_size: 0.1 # fraction of the training dataset to be used for validation

# point to data files
data_dir: /deos/fional/remotap/simulations/RemoTAP_FWD/s5_random_ensemble_1e5_only_CO2I/SWIR1_preprocessed/combined_nchunks=10
prefix: syn_meas_s5_random_ensemble_1e5_only_CO2I_combined

# define output quantity
target_quantity: radiance
predict_difference: true

# should be adjusted to the actual number of features and wavelengths in 
# the dataset (is used to define the model input/output dimensions)
input_dim: 303 # all features
output_dim: 851 # all wavelengths

# define input features
pixel_features:
  - Cos_SolarZenithAngle
  # - Cos_ViewingZenithAngle
  # - Cos_RelativeAzimuthAngle
  # - Air_Mass_Factor
  # - surface_pressure_meteo
  # - surface_elevation_dem
  # - surface_elevation_std
  - Log_Truth_SSA
  - Truth_Mode_AAOT
  - Truth_AAOT
  - Log_Truth_Mode_AOT
  - Log_Truth_AOT
  # - Truth_Xbdrf_Wave # not available anymore in newest RemoTAP version
  - Truth_Xbdrf_Wave_Geo
  - Truth_Xbdrf_Wave_Av
  - Truth_Xbdrf_Wave_Par
  - Log_Truth_Mode2_TAU550
  - Log_Truth_Mode2_TAU550
  - Truth_Mode2_Xalt
  - Truth_Mode1_Aerosol_Pars
  - Truth_Mode2_Aerosol_Pars
profile_features:
  # - temperature
  # - pressure
  - specific_humidity
  - MMR_co2
  - MMR_ch4

  # transforms for input features
transform:
  _target_: rtm.utils.NumpyToTensor

# transforms for output spectra
target_transform:
  _target_: rtm.utils.RTMCompose
  transforms:
    - _target_: rtm.utils.NumpyToTensor
    - _target_: rtm.utils.LogTransform