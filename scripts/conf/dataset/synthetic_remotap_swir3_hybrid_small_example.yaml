# @package dataset
name: synthetic_remotap_swir3_hybrid_small_example
_target_: rtm.datasets.uvns_datasets.RTDataset

band: swir3

# don't touch to ensure the same data split is used for all experiments
seed: 0 # random seed used to define data split
test_size: 0.1 # fraction of the dataset to be used for testing
val_size: 0.05555 # fraction of the training dataset to be used for validation

# point to data files
data_dir: ${device.data_root}/small_example/SWIR3_preprocessed/combined_nchunks=16
prefix: syn_meas_s5_random_ensemble_combined

# define output quantity
target_quantity: radiance
predict_difference: false
predict_ratio: true

# should be adjusted to the actual number of features and wavelengths in 
# the dataset (is used to define the model input/output dimensions)
input_dim: 11 # all features
output_dim: 801 # all wavelengths
profile_dim: 19 # vertical layers in temperature profile

# define input features
pixel_features:
  - cos_SolarZenithAngle
  - cos_ViewingZenithAngle
  - RelativeAzimuthAngle_rad # note that Lintran uses this in radians as defined by De Haan et al. (1987)
  - ScatteringAngle_rad
  - surface_pressure_meteo
  - albedo
  - reff_mode1
  - AOT_550_mode1
  - z_aer_mode1
  - vmol_h2o
  - vmol_ch4
profile_features:
  - temperature

# normalization settings
normalization:
  per_wavelength: true # normalize spectral channels separately
  per_layer: true # normalize vertical layers separately
  coupled_proxy: false # separate proxy and target normalization