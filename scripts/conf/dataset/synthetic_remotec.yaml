# @package dataset
name: synthetic_remotec
_target_: rtm.datasets.uvns_datasets.FlatRTDataset

# don't touch to ensure the same data split is used for all experiments
seed: 0 # random seed used to define data split
test_size=: 0.2 # fraction of the dataset to be used for testing

# point to data files
data_dir: /nfs/Sentinel5/users/fional/S5_test_data/s5_caseE_ensemble/BAND3_preprocessed
prefix: ensemble

# define output quantity
target_quantity: radiance
predict_difference: false

# define input features
pixel_features:
  - cos_solar_zenith_angle
  - cos_viewing_zenith_angle
  - cos_relative_azimuth_angle
  - air_mass_factor
  - meanh
  - log_surface_albedo
  - sp
  - z
  - aerosol_optical_thickness
  - cirrus_tau_ref
  - cirrus_top_height
  - cirrus_geom_thickness
  - aer_tau_ref
  - aer_reff_mode_0
  - aer_reff_mode_1
  - aer_reff_mode_2
  - aer_reff_mode_3
  - aer_reff_mode_4
  - aer_reff_mode_5
  - aer_reff_mode_6
  - aer_veff_mode_0
  - aer_veff_mode_1
  - aer_veff_mode_2
  - aer_veff_mode_3
  - aer_veff_mode_4
  - aer_col_relative_mode_0
  - aer_col_relative_mode_1
  - aer_col_relative_mode_2
  - aer_col_relative_mode_3
  - aer_col_relative_mode_4
  - aer_col_relative_mode_5
  - aer_col_relative_mode_6
profile_features:
  - t
  - p
  - H2O
  - CO2
  - CH4
  - CO
  - aer_numb_relative_mode_0
  - aer_numb_relative_mode_1
  - aer_numb_relative_mode_2
  - aer_numb_relative_mode_3
  - aer_numb_relative_mode_4
  - aer_numb_relative_mode_5
  - aer_numb_relative_mode_6

  # transforms for input features
transform:
  _target_: rtm.utils.NumpyToTensor

# transforms for output spectra
target_transform:
  _target_: rtm.utils.RTMCompose
  transforms:
    - _target_: rtm.utils.NumpyToTensor
    - _target_: rtm.utils.LogTransform