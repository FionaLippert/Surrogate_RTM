# @package dataset
name: synthetic_remotap_swir1_extended_era5_single_norm_coupled_proxy
_target_: rtm.datasets.uvns_datasets.FlatRTDataset

# don't touch to ensure the same data split is used for all experiments
seed: 0 # random seed used to define data split
test_size: 0.1 # fraction of the dataset to be used for testing
val_size: 0.05 # fraction of the training dataset to be used for validation

# point to data files
data_dir: ${device.data_root}/random_ensemble_1e6_new/SWIR1_preprocessed/combined_nchunks=16
prefix: syn_meas_s5_random_ensemble_1e6_combined
# data_dir: ${device.data_root}/random_ensemble_1e6/SWIR1_preprocessed
# prefix: syn_meas_s5_random_ensemble_1e6_01

# define output quantity
target_quantity: radiance
predict_difference: false

# should be adjusted to the actual number of features and wavelengths in 
# the dataset (is used to define the model input/output dimensions)
input_dim: 332 # all features
output_dim: 851 # all wavelengths

# define input features
pixel_features:
  - cos_SolarZenithAngle
  - cos_ViewingZenithAngle
  - cos_RelativeAzimuthAngle
  # - air_mass_factor
  - ScatteringAngle
  - surface_pressure_meteo
  - cbrt_surface_elevation_meteo
  - tropopause_height
  # - xco
  - xch4
  - xh2o
  - xco2
  # - vmol_co
  # - vmol_ch4
  # - vmol_h2o
  # - vmol_co2
  - log_AOT
  - log_AOT_mode1
  - log_AOT_mode2
  - log_AAOT
  - log_AAOT_mode1
  - log_AAOT_mode2
  - SSA
  - log_N_mode1
  - log_N_mode2
  - reff_mode1
  - reff_mode2
  - veff_mode1
  - veff_mode2
  - RRI_mode1
  - RRI_mode2
  - IRI_mode1
  - IRI_mode2
  - f_sphere_mode1
  - f_sphere_mode2
  - vfrac_mode1_species1
  - vfrac_mode1_species4
  - vfrac_mode1_species5
  - vfrac_mode2_species2
  - vfrac_mode2_species5
  - z_aer_mode1
  # - z_aer_mode2 # same as for mode 1
  - k_geo
  - k_vol
  - albedo
  - B_pol
  # - v_pol # fixed to 0.1
profile_features:
  - temperature
  - pressure
  - log_specific_humidity
  # - cbrt_specific_humidity
  - MMR_co2
  - MMR_ch4
  - MMR_h2o
  # - MMR_co


# normalization settings
normalization:
  per_wavelength: false # normalize spectral channels separately
  per_layer: true # normalize vertical layers separately
  coupled_proxy: true # use same normalization for proxy and targets