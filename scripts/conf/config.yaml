# main config file
defaults:
  - _self_
  - dataset: synthetic_remotap_swir1_spectrometer_only_LHS_matched_retrieval_era5_paper
  - model: Base_emulator_paper
  - transforms: log_targets_log_proxy_log_albedo_era5
  - task: train+eval
  - device: local
  - logger: wandb
  - trainer: lightning
  - dataloader: pytorch
seed: 1234
verbose: True

# define place to save results to
result_path: ${join_paths:${device.output_dir},results,${logger.project},${logger.group}}
output_path: null

# define place to save pytorch datasets to
data_path: ${join_paths:${device.output_dir},datasets}